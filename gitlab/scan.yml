# Sentinel upgrade scan for GitLab CI.
#
# Include this file at a release tag and override the job with your own site
# image, database service and SENTINEL_* variables. See the README.
#
# The job downloads scan.sh from the same release and checks its SHA-256
# before running it. scripts/pin-gitlab.sh writes both values below.

sentinel-upgrade-scan:
  variables:
    SENTINEL_UPGRADE_SCAN_REF: v1.0.0
    SENTINEL_UPGRADE_SCAN_SHA256: 754c4dcb9e4a03c1f830e35e277c7064b711dba94636a569947a93aebd193b86
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      curl -fsSL --proto '=https' -o /tmp/sentinel-upgrade-scan.sh \
        "https://raw.githubusercontent.com/truecms/sentinel-upgrade-scan/${SENTINEL_UPGRADE_SCAN_REF}/scan.sh"
      echo "${SENTINEL_UPGRADE_SCAN_SHA256}  /tmp/sentinel-upgrade-scan.sh" | sha256sum -c -
      bash /tmp/sentinel-upgrade-scan.sh
